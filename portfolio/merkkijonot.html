<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/x-icon" href="../images/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="keywords" content="JavaScript, Calc, Variable">
    <meta name="description" content="JavaScript Variables Calc Thing">
    <meta name="author" content="Siiri">
    <title>Merkkijonot</title>

    <script src="../JavaScript/merkkijonot.js" defer></script>
    <link rel="stylesheet" href="../css/merkkijonot.css">
</head>

<body>
<header>
    <h1>MERKKIJONOT</h1>
</header>
<!--Nav Bar-->

<!--Main Area-->
<main>
<!-- Poiminta -->
<section>
    <h3 style="text-align: center;">Poimi KirjAin</h3>
    <label>Word:</label>
    <input type="text" id="word"> <br>
    <label>Number:</label>
    <input type="number" id="nmbr"> <br>
    <button class="b" onclick="get_letter()">Check letter's place</button>
    <div id="letrSpot"></div>
</section>
<!-- Index löytö -->
<section>
    <h3 style="text-align: center;">LöydÄ indeksi</h3>
    <label>Text:</label>
    <input type="text" id="text"> <br>
    <label>Letter(s):</label>
    <input type="text" id="letters"> <br>
    <button class="b" onclick="get_index()">Show place</button>
    <div id="indexSpot"></div>
</section>
<!-- String slice -->
<section>
    <h3 style="text-align: center;">LeikkAA merkkijono</h3>
    <label>Sring:</label>
    <input type="text" id="string"> 
    <br>
    <label>Position 1:</label>
    <input type="number" id="posOne">
    <br>
    <label>Position 2:</label>
    <input type="number" id="posTwo"> 
    <br>
    <button class="b" onclick="get_slice()">Show results</button>
    <div id="cutString"></div>
</section>
<!-- Replace -->
<section>
    <h3 style="text-align: center;">Etsi jA korvAA</h3>
    <label>Text:</label>
    <input type="text" id="givenTxt"> 
    <br>
    <label>Replace:</label>
    <input type="text" id="replace">
    <br>
    <label>Replacement:</label>
    <input type="text" id="replacement"> 
    <br>
    <button class="b" onclick="get_replacement()">Show results</button>
    <div id="replacementSpot"></div>
</section>

<section>
    <h3 style="text-align: center;">Poikki jA pinoon</h3>
    <label>Text:</label>
    <input type="text" id="splitTxt">
    <br>
    <label>Split spot:</label>
    <input type="text" id="splitSpot">
    <br>
    <button class="b" onclick="split_position()">Show results</button>
    <ul id="listSpot"></ul>
</section>

</main>

</body>
</html>
